services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 20

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: sensors
      POSTGRES_PASSWORD: sensors
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    cpus: 1.5
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensors -d sensors"]
      interval: 2s
      timeout: 5s
      retries: 30

  consumer:
    build: ./app
    image: sensor-benchmark:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-baseline}
      CONSUMER_CONCURRENCY: ${PARTITIONS:-3}
      BENCHMARK_EXPECTED_MESSAGES: ${MESSAGES:-2000000}
    cpus: 2
    mem_limit: 1g
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  producer:
    image: sensor-benchmark:latest
    profiles: ["tools"]
    entrypoint:
      - java
      - -cp
      - /app/app.jar
      - -Dloader.main=com.example.sensors.producer.ProducerKt
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      SENSORS: ${SENSORS:-600000}
      MESSAGES: ${MESSAGES:-2000000}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
